name: Subdomain Searcher Tests

on:
  push:
    paths:
      - 'subdomain_searcher.py'
      - 'tests/**'
      - '.github/workflows/subdomain-searcher-tests.yml'
  pull_request:
    paths:
      - 'subdomain_searcher.py'
      - 'tests/**'
      - '.github/workflows/subdomain-searcher-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest -q
